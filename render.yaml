# Render Blueprint：推送到 GitHub 后，在 Render 选 "New > Blueprint" 即可一键部署
# 部署完成后 Render 会给出 https://<服务名>.onrender.com
services:
  - type: web
    name: asset-manager
    runtime: python
    plan: free
    region: singapore
    # 只依赖 Python 标准库，无需构建步骤
    buildCommand: ""
    startCommand: python -u server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BIND
        value: "0.0.0.0"
      - key: AUTH_USER
        value: "admin"
      - key: AUTH_PASS
        value: "12345678"
      - key: WARMUP
        value: "1"
