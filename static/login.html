<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>资产管家 · 登录</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  body{background:linear-gradient(160deg,#eef2f9 0%,#f7f8fb 45%,#eaf0fb 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-card{
    width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 10px 40px rgba(15,23,42,.10);padding:32px 30px 26px;
  }
  .login-brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .login-brand .logo{width:38px;height:38px;font-size:19px;border-radius:10px}
  .login-brand b{display:block;font-size:16px}
  .login-brand small{display:block;font-size:11.5px;color:var(--muted)}
  .login-card h2{margin:0 0 4px;font-size:19px;font-weight:600}
  .login-card .sub{margin:0 0 22px;font-size:12.5px;color:var(--muted)}
  .fld{margin-bottom:14px}
  .fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fld input{
    width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:14px;
  }
  .fld input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .login-btn{
    width:100%;border:0;background:var(--brand);color:#fff;border-radius:9px;padding:11px;
    font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:.15s;
  }
  .login-btn:hover{background:#1d4fd8}
  .login-btn:disabled{background:#a9bce4;cursor:not-allowed}
  .err{
    display:none;background:#fdf1f1;border:1px solid #f6d4d4;color:#b42318;
    border-radius:8px;padding:8px 11px;font-size:12.5px;margin-bottom:14px;
  }
  .err.show{display:block}
  .tip{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
  .mode{margin-top:10px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">A</div>
      <div>
        <b>资产管家</b>
        <small>净值核算 · 历史回测 · 走势预测</small>
      </div>
    </div>

    <h2>登录</h2>
    <p class="sub">请输入账号密码以继续使用</p>

    <div class="err" id="err"></div>

    <form id="form" autocomplete="off">
      <label class="fld">
        <span>用户名</span>
        <input type="text" id="user" value="admin" autocomplete="username" />
      </label>
      <label class="fld">
        <span>密码</span>
        <input type="password" id="pass" placeholder="请输入密码" autocomplete="current-password" />
      </label>
      <button type="submit" class="login-btn" id="btn">登 录</button>
    </form>

    <div class="mode" id="mode"></div>
    <div class="tip">
      数据仅保存在您本机浏览器，不会上传到任何服务器
    </div>
  </div>

<script>
(function () {
  'use strict';
  var AUTH_USER = 'admin';
  var AUTH_SALT = 'asset-manager-2026';
  // sha256("asset-manager-2026:admin:<密码>")
  var AUTH_HASH = '9a284aa1a6ebdc8fd603fc371156754806222d6cf1aa005df1988583567a66f1';
  var SESSION_KEY = 'am_auth';

  var errBox = document.getElementById('err');
  var btn = document.getElementById('btn');
  var modeEl = document.getElementById('mode');

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }
  function hideErr() { errBox.classList.remove('show'); }

  function sha256Hex(str) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      var buf = new TextEncoder().encode(str);
      return crypto.subtle.digest('SHA-256', buf).then(function (d) {
        return Array.from(new Uint8Array(d))
          .map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    }
    return Promise.reject(new Error('no subtle'));
  }

  /* 有后端时交给服务端校验（真正的安全边界）；静态部署时退回本地哈希校验 */
  function tryBackend(user, pass) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var opt = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: user, pass: pass })
    };
    if (ctl) { opt.signal = ctl.signal; setTimeout(function () { ctl.abort(); }, 2500); }
    return fetch('api/login', opt).then(function (r) {
      if (r.status === 404 || r.status === 405) return { none: true };
      // 静态托管常把未匹配路径回退成 index.html（200 + text/html），
      // 必须按 Content-Type 识别，否则任意密码都会被误判为登录成功
      var ct = (r.headers && r.headers.get ? r.headers.get('content-type') : '') || '';
      if (ct.indexOf('application/json') < 0) return { none: true };
      return r.json().then(function (j) { return { ok: !!j.ok && r.ok }; })
        .catch(function () { return { none: true }; });
    }).catch(function () { return { none: true }; });
  }

  function succeed(mode) {
    try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
    try { localStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
    modeEl.textContent = mode;
    location.href = 'index.html';
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    hideErr();
    var user = (document.getElementById('user').value || '').trim();
    var pass = document.getElementById('pass').value || '';
    if (!user || !pass) { showErr('请输入用户名和密码'); return; }

    btn.disabled = true;
    btn.textContent = '验证中…';

    tryBackend(user, pass).then(function (res) {
      if (res.none) {
        // 静态部署：本地哈希校验
        return sha256Hex(AUTH_SALT + ':' + user + ':' + pass).then(function (h) {
          if (h === AUTH_HASH) succeed('离线版 · 本地校验通过');
          else { btn.disabled = false; btn.textContent = '登 录'; showErr('用户名或密码错误'); }
        }).catch(function () {
          btn.disabled = false; btn.textContent = '登 录';
          showErr('当前环境不支持本地校验，请通过启动脚本访问');
        });
      }
      if (res.ok) succeed('服务端校验通过');
      else { btn.disabled = false; btn.textContent = '登 录'; showErr('用户名或密码错误'); }
    });
  });

  document.getElementById('pass').focus();
})();
</script>
</body>
</html>
